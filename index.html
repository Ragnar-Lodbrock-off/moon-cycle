<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лунный и менструальный календарь</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="script.js"></script>
    
    <div class="container">
        <h1>Лунный и менструальный календарь</h1>
        
        <div class="info-panel">
            <div id="current-date"></div>
            <div id="moon-phase"></div>
            <div id="lunar-day"></div>
        </div>

        <div class="calendar-container">
            <h2>Круговой лунный календарь (28 дней)</h2>
            <canvas id="circular-calendar" width="400" height="400"> 
                        
            <div class="legend">
                <div><span class="legend-color" style="background-color: #ff6b6b;"></span> Менструация</div>
                <div><span class="legend-color" style="background-color: #4ecdc4;"></span> Фолликулярная фаза</div>
                <div><span class="legend-color" style="background-color: #45b7d1;"></span> Овуляция</div>
                <div><span class="legend-color" style="background-color: #96ceb4;"></span> Лютеиновая фаза</div>
                </canvas>
            </div>
        </div>
    <canvas id="cycleChart" width="600" height="400"></canvas>

    <script>
        const ctx = document.getElementById('cycleChart').getContext('2d');
        const cycleChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: [
                    'Менструация',
                    'Фолликулярная фаза',
                    'Овуляция',
                    'Лютеиновая фаза'
                ],
                datasets: [{
                    data: [5, 10, 2, 12], // примерные значения (дни)
                    backgroundColor: [
                        '#e74c3c', // Менструация
                        '#3498db', // Фолликулярная
                        '#f1c40f', // Овуляция
                        '#2ecc71'  // Лютеиновая
                    ],
                    hoverOffset: 10
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'right'
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.label || '';
                                let value = context.raw || 0;
                                return `${label}: ${value} дней`;
                            }
                        }
                    }
                },
                onClick: function(evt, item) {
                    if (item.length) {
                        const phase = this.data.labels[item[0].index];
                        const value = this.data.datasets[0].data[item[0].index];
                        alert(`Фаза: ${phase}\nПродолжительность: ${value} дней`);
                    }
                }
            }
        });
    </script>
        <div class="phase-selector">
            <h3>Отметить фазу для выбранного дня:</h3>
            <select id="phase-select">
                <option value="menstruation">Менструация</option>
                <option value="follicular">Фолликулярная фаза</option>
                <option value="ovulation">Овуляция</option>
                <option value="luteal">Лютеиновая фаза</option>
            </select>
            <button id="save-phase">Сохранить</button>
        </div>
    </div>
</body>
</html>
