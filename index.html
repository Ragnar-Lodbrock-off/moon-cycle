!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лунный и женский календарь</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
    <div class="container">
        <h1>Лунный и женский календарь</h1>
        
        <div class="info">
            <p>Текущий месяц: <span id="current-month"></span></p>
            <p>Фаза луны: <span id="moon-phase"></span></p>
            <p>День лунного календаря: <span id="lunar-day"></span></p>
        </div>

        <div class="calendar">
            <h2>Круговой календарь (28 дней)</h2>
            <div id="interactive-chart" style="width: 300px; height: 300px;"></div>
        </div>

        <div class="summary">
            <h2>Сводная диаграмма фаз</h2>
            <div id="summary-chart" style="width: 300px; height: 300px;"></div>
               <canvas id="cycleChart" width="600" height="400"></canvas>

    <script>
        const ctx = document.getElementById('cycleChart').getContext('2d');
        const cycleChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: [
                    'Менструация',
                    'Фолликулярная фаза',
                    'Овуляция',
                    'Лютеиновая фаза'
                ],
                datasets: [{
                    data: [5, 10, 2, 12], // примерные значения (дни)
                    backgroundColor: [
                        '#e74c3c', // Менструация
                        '#3498db', // Фолликулярная
                        '#f1c40f', // Овуляция
                        '#2ecc71'  // Лютеиновая
                    ],
                    hoverOffset: 10
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'right'
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.label || '';
                                let value = context.raw || 0;
                                return `${label}: ${value} дней`;
                            }
                        }
                    }
                },
                onClick: function(evt, item) {
                    if (item.length) {
                        const phase = this.data.labels[item[0].index];
                        const value = this.data.datasets[0].data[item[0].index];
                        alert(`Фаза: ${phase}\nПродолжительность: ${value} дней`);
                    }
                }
            }
        });
    </script>
        </div>
    </div>

</body>
</html>
