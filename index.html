<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лунный и женский календарь</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Лунный и женский календарь</h1>
        
        <div class="info">
            <p>Текущий месяц: <span id="current-month"></span></p>
            <p>Фаза луны: <span id="moon-phase"></span></p>
            <p>День лунного календаря: <span id="lunar-day"></span></p>
        </div>

        <div class="calendar">
            <h2>Круговой календарь (28 дней)</h2>
            <div id="interactive-chart" style="width: 300px; height: 300px;"></div>
        </div>

        <div class="summary">
            <h2>Сводная диаграмма фаз</h2>
            <div id="summary-chart" style="width: 300px; height: 300px;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
